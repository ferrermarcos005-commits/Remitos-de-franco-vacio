name: Diagnostico
on:
  push:
    branches: [diagnostico]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8766 &) && sleep 1 && node scripts/prueba-real.mjs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
