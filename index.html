<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remitos Franco</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f6feb">
<script src="config.js"></script>
<script src="jszip.min.js" defer></script>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--txt:#1b1f24;--sub:#5b6470;--pri:#1f6feb;--warn:#d1242f;--ok:#1a7f37;--line:#d8dee4;--soft:#eef2f6}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--txt:#e6edf3;--sub:#9198a1;--line:#30363d;--soft:#21262d}}
  [hidden]{display:none!important}
  *{box-sizing:border-box} body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px}
  header h1{margin:0;font-size:20px} header p{margin:2px 0 0;font-size:14px;opacity:.9}
  #btnVolver{background:transparent;font-size:26px;padding:0 6px;line-height:1}
  main{padding:12px 16px 96px;max-width:680px;margin:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .pend{border-left:6px solid var(--warn)} .done{border-left:6px solid var(--ok)}
  .clic{cursor:pointer}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pat{font-size:20px;font-weight:700;letter-spacing:1px} .tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line)}
  .big{font-size:18px;font-weight:600;margin-top:2px} .sub{color:var(--sub);font-size:14px}
  .barra{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 4px} .barra i{display:block;height:100%;background:var(--ok)}
  .pend .barra i{background:var(--warn)}
  button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer}
  button:disabled{opacity:.5}
  button.sec{background:var(--line);color:var(--txt)} button.ok{background:var(--ok)} button.mini{padding:6px 10px;font-size:14px}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);margin:4px 0 10px}
  label{font-size:14px;color:var(--sub)} h2{font-size:16px;margin:18px 0 8px}
  .fab{position:fixed;right:16px;bottom:16px;font-size:18px;padding:14px 20px;border-radius:99px;box-shadow:0 4px 12px #0004}
  dialog{border:0;border-radius:14px;padding:16px;width:min(94vw,520px);max-height:92vh;background:var(--card);color:var(--txt)}
  dialog h2{margin-top:0}
  .banner{background:#fff3cd;color:#664d03;padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px}
  .rem{border-top:1px solid var(--line);padding:10px 0} .rem:first-child{border-top:0;padding-top:0}
  .rem b{font-size:17px}
  .files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .file{position:relative;width:84px;text-align:center;font-size:11px;color:var(--sub);word-break:break-all}
  .file a{display:block;color:inherit;text-decoration:none}
  .file img,.file .ico{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--soft)}
  .file .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;padding:0;border-radius:99px;background:var(--warn);font-size:14px;line-height:26px}
  .nuevos{font-size:14px;margin:6px 0} .nuevos div{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
  #ocupado{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}
  #ocupado div{background:var(--card);color:var(--txt);padding:18px 22px;border-radius:12px;max-width:80vw;text-align:center}
</style>
</head>
<body>
<header>
  <button id="btnVolver" hidden aria-label="Volver">←</button>
  <div><h1 id="titulo">Remitos por patente</h1><p id="resumen"></p></div>
</header>

<main>
  <div id="error" class="banner" hidden></div>

  <section id="vistaLista">
    <div id="avisoNotif" class="banner" hidden>Activá las notificaciones para que te recuerde los pendientes. <button id="btnNotif" class="mini">Activar</button></div>
    <h2>Pendientes</h2><div id="listaPend"></div>
    <h2>Completas</h2><div id="listaDone"></div>
    <h2>Avisos</h2>
    <div class="card"><div class="sub" id="estadoAvisos"></div>
      <div class="acts"><button class="sec" id="btnProbar">Probar notificación</button><button class="sec" id="btnRecargar">Actualizar</button></div></div>
  </section>

  <section id="vistaPatente" hidden>
    <div class="card" id="cabPatente"></div>
    <h2>Remitos</h2>
    <div class="card" id="listaRemitos"></div>
  </section>
</main>
<button class="fab" id="btnNuevo">+ Patente</button>

<dialog id="dlg"><form id="frm">
  <h2 id="dlgTit">Nueva patente</h2>
  <label>Patente</label><input name="patente" required placeholder="AB123CD" style="text-transform:uppercase" autocomplete="off">
  <label>Tipo</label><select name="tipo"><option>Camión/Semi</option><option>Balancín</option></select>
  <label>Remitos que tendrían que venir</label><input name="esperados" type="number" min="0" required inputmode="numeric">
  <label>Nota (ej: faltan clientes, termina mañana)</label><textarea name="nota" rows="2"></textarea>
  <div class="acts"><button type="submit">Guardar</button><button class="sec" type="button" data-cerrar>Cancelar</button></div>
</form></dialog>

<dialog id="dlgR"><form id="frmR">
  <h2 id="rTit">Remito</h2>
  <label>Número de remito</label><input name="numero" required autocomplete="off">
  <label>Instrucción</label><textarea name="instruccion" rows="2"></textarea>
  <label>Mercadería llevada</label><textarea name="mercaderia" rows="2"></textarea>
  <label>Fotos y archivos</label>
  <div class="files" id="rExistentes"></div>
  <div class="nuevos" id="rNuevos"></div>
  <div class="acts">
    <button type="button" class="sec" id="btnFoto">📷 Sacar foto</button>
    <button type="button" class="sec" id="btnArchivo">📎 Adjuntar archivo</button>
  </div>
  <input type="file" id="inFoto" accept="image/*" capture="environment" hidden>
  <input type="file" id="inArchivo" multiple hidden>
  <div class="acts"><button type="submit" id="btnGuardarR">Guardar remito</button><button class="sec" type="button" data-cerrar>Cancelar</button></div>
</form></dialog>

<div id="ocupado" hidden><div id="ocupadoTxt">Un momento…</div></div>

<script>
const C=window.CONFIG||{};
const BUCKET='archivos';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha=t=>new Date(t).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const dias=t=>{const n=Math.floor((Date.now()-new Date(t))/864e5);return n<=0?'hoy':n===1?'ayer':`hace ${n} días`};
const hechos=d=>d.remitos.length, faltan=d=>Math.max(0,d.esperados-hechos(d));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
let datos=[], archivos=[], hayTablaArchivos=true, reg=null, estadoPush='';

// ---------- Servidor (Supabase) ----------
function cab(extra={}){return {apikey:C.SUPABASE_ANON_KEY,Authorization:'Bearer '+C.SUPABASE_ANON_KEY,...extra}}
async function api(path,{method='GET',body,prefer}={}){
  const h=cab({'Content-Type':'application/json'}); if(prefer)h.Prefer=prefer;
  const r=await fetch(`${C.SUPABASE_URL}/rest/v1/${path}`,{method,headers:h,body:body&&JSON.stringify(body)});
  const txt=await r.text();
  if(!r.ok)throw new Error(`${r.status} ${txt}`);
  try{return txt?JSON.parse(txt):null}catch{return null}
}
const urlArchivo=ruta=>`${C.SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${ruta.split('/').map(encodeURIComponent).join('/')}`;
async function subirArchivo(ruta,blob){
  const r=await fetch(`${C.SUPABASE_URL}/storage/v1/object/${BUCKET}/${ruta}`,{method:'POST',headers:cab({'Content-Type':blob.type||'application/octet-stream','x-upsert':'false','cache-control':'max-age=31536000'}),body:blob});
  if(!r.ok)throw new Error(`No se pudo subir el archivo (${r.status} ${await r.text()})`);
}
async function borrarArchivosStorage(rutas){
  if(!rutas.length)return;
  const r=await fetch(`${C.SUPABASE_URL}/storage/v1/object/${BUCKET}`,{method:'DELETE',headers:cab({'Content-Type':'application/json'}),body:JSON.stringify({prefixes:rutas})});
  if(!r.ok)console.log('borrar storage',r.status,await r.text());
}

async function recargar(){
  try{
    datos=await api('patentes?select=*,remitos(*)&order=creado.asc&remitos.order=creado.asc');
    try{archivos=await api('archivos?select=*&order=creado.asc');hayTablaArchivos=true}
    catch(e){archivos=[];hayTablaArchivos=false;console.log('archivos',e)}
    $('#error').hidden=hayTablaArchivos;
    if(!hayTablaArchivos)$('#error').textContent='Falta actualizar la base de datos para poder adjuntar fotos y archivos.';
  }catch(e){
    $('#error').hidden=false;$('#error').textContent='No pude conectar con el servidor. Revisá la señal y tocá Actualizar.';console.log(e);
  }
  render();
}
async function hacer(msg,fn){
  ocupado(msg);
  try{await fn()}catch(e){alert('No se pudo completar: '+e.message);console.log(e)}
  ocupado('Actualizando…');await recargar();ocupado(false);
}
function ocupado(msg){$('#ocupado').hidden=!msg;if(msg)$('#ocupadoTxt').textContent=msg}

// ---------- Pantallas ----------
const byId=id=>datos.find(x=>x.id===id);
const archivosDe=remId=>archivos.filter(a=>a.remito_id===remId);
const esImagen=a=>(a.tipo||'').startsWith('image/');
function patenteActual(){const m=location.hash.match(/^#\/p\/(.+)$/);return m&&byId(m[1])}

function render(){
  const p=patenteActual();
  $('#vistaLista').hidden=!!p;$('#vistaPatente').hidden=!p;$('#btnVolver').hidden=!p;
  $('#btnNuevo').textContent=p?'+ Remito':'+ Patente';
  p?renderPatente(p):renderLista();
  const pend=datos.filter(d=>faltan(d)>0);
  if(navigator.setAppBadge){pend.length?navigator.setAppBadge(pend.length).catch(()=>{}):navigator.clearAppBadge().catch(()=>{})}
}
function barra(d){const pc=d.esperados?Math.min(100,Math.round(hechos(d)/d.esperados*100)):100;return `<div class="barra"><i style="width:${pc}%"></i></div>`}
function renderLista(){
  const pend=datos.filter(d=>faltan(d)>0), done=datos.filter(d=>faltan(d)===0).reverse();
  $('#titulo').textContent='Remitos por patente';
  $('#resumen').textContent=pend.length?`${pend.length} patente(s) con remitos pendientes`:'Todo al día 👌';
  const card=d=>{const nf=archivos.filter(a=>a.patente_id===d.id).length;return `<div class="card clic ${faltan(d)?'pend':'done'}" onclick="location.hash='#/p/${d.id}'">
    <div class="row"><span class="pat">${esc(d.patente)}</span><span class="tag">${esc(d.tipo)}</span></div>
    <div class="big">${hechos(d)} de ${d.esperados} remitos ${faltan(d)?`· faltan ${faltan(d)}`:'✔'}</div>${barra(d)}
    <div class="sub">Cargada ${dias(d.creado)}${nf?` · ${nf} archivo(s)`:''}${d.nota?' · '+esc(d.nota):''}</div></div>`};
  $('#listaPend').innerHTML=pend.map(card).join('')||'<p class="sub">No hay pendientes.</p>';
  $('#listaDone').innerHTML=done.map(card).join('')||'<p class="sub">Nada todavía.</p>';
  const perm='Notification' in window?Notification.permission:'no';
  $('#avisoNotif').hidden=perm==='granted'||perm==='no';
  $('#estadoAvisos').innerHTML='Avisos cada 1 hora, de lunes a viernes de 8 a 18, mientras haya pendientes.<br>'+
    (perm==='granted'?'Notificaciones permitidas en este dispositivo ✔':'Notificaciones sin activar en este dispositivo.')+(estadoPush?'<br>'+esc(estadoPush):'');
}
function miniatura(a,borrable){
  const ico=esImagen(a)?`<img src="${urlArchivo(a.ruta)}" alt="" loading="lazy">`:`<span class="ico">${(a.tipo||'').includes('pdf')?'📄':'📎'}</span>`;
  return `<div class="file"><a href="${urlArchivo(a.ruta)}" target="_blank" rel="noopener">${ico}${esc(a.nombre.length>22?a.nombre.slice(0,20)+'…':a.nombre)}</a>
    ${borrable?`<button type="button" class="x" title="Quitar" onclick="quitarArchivo('${a.id}')">✕</button>`:''}</div>`;
}
function renderPatente(d){
  $('#titulo').textContent=d.patente;
  $('#resumen').textContent=faltan(d)?`Faltan ${faltan(d)} remito(s)`:'Patente completa ✔';
  const nf=archivos.filter(a=>a.patente_id===d.id).length;
  $('#cabPatente').className='card '+(faltan(d)?'pend':'done');
  $('#cabPatente').innerHTML=`<div class="row"><span class="pat">${esc(d.patente)}</span><span class="tag">${esc(d.tipo)}</span></div>
    <div class="big">${hechos(d)} de ${d.esperados} remitos ${faltan(d)?`· faltan ${faltan(d)}`:'✔'}</div>${barra(d)}
    <div class="sub">Cargada ${fecha(d.creado)} · ${nf} archivo(s)${d.nota?'<br>Nota: '+esc(d.nota):''}</div>
    <div class="acts"><button class="ok" onclick="descargarPatente('${d.id}')">⬇ Descargar todo</button>
      <button class="sec" onclick="editarPatente('${d.id}')">Editar</button><button class="sec" onclick="borrarPatente('${d.id}')">Borrar</button></div>`;
  $('#listaRemitos').innerHTML=d.remitos.map(r=>{const fs=archivosDe(r.id);return `<div class="rem">
      <div class="row"><b>N° ${esc(r.numero)}</b><span class="sub">${fecha(r.creado)}</span></div>
      ${r.instruccion?`<div>Instrucción: ${esc(r.instruccion)}</div>`:''}${r.mercaderia?`<div>Mercadería: ${esc(r.mercaderia)}</div>`:''}
      ${fs.length?`<div class="files">${fs.map(a=>miniatura(a,false)).join('')}</div>`:'<div class="sub">Sin fotos ni archivos.</div>'}
      <div class="acts"><button class="sec mini" onclick="abrirRemito('${d.id}','${r.id}')">Completar / adjuntar</button><button class="sec mini" onclick="borrarRemito('${r.id}')">Quitar</button></div></div>`}).join('')
    ||'<p class="sub">Todavía no hay remitos. Tocá "+ Remito" para cargar el primero.</p>';
}
window.addEventListener('hashchange',render);
$('#btnVolver').onclick=()=>{history.length>1?history.back():location.hash=''};

// ---------- Patentes ----------
let editId=null;
$('#btnNuevo').onclick=()=>{const p=patenteActual();if(p)return abrirRemito(p.id,null);
  editId=null;$('#frm').reset();$('#dlgTit').textContent='Nueva patente';$('#dlg').showModal()};
window.editarPatente=id=>{const d=byId(id);editId=id;const f=$('#frm');
  ['patente','tipo','esperados','nota'].forEach(k=>f[k].value=d[k]??'');$('#dlgTit').textContent='Editar patente';$('#dlg').showModal()};
$('#frm').onsubmit=e=>{e.preventDefault();const f=$('#frm');
  const v={patente:f.patente.value.trim().toUpperCase(),tipo:f.tipo.value,esperados:+f.esperados.value,nota:f.nota.value.trim()};
  $('#dlg').close();
  hacer('Guardando…',async()=>{if(editId)await api('patentes?id=eq.'+editId,{method:'PATCH',body:v});
    else{const [n]=await api('patentes',{method:'POST',body:v,prefer:'return=representation'});datos.push({...n,remitos:[]});location.hash='#/p/'+n.id}})};
window.borrarPatente=id=>{const d=byId(id);if(!confirm(`¿Borrar la patente ${d.patente} con todos sus remitos y archivos?`))return;
  hacer('Borrando…',async()=>{await borrarArchivosStorage(archivos.filter(a=>a.patente_id===id).map(a=>a.ruta));
    await api('patentes?id=eq.'+id,{method:'DELETE'});location.hash=''})};

// ---------- Remitos y archivos ----------
let remPat=null, remId=null, nuevos=[];
window.abrirRemito=(pid,rid)=>{
  remPat=pid;remId=rid;nuevos=[];const f=$('#frmR');f.reset();
  const r=rid&&byId(pid).remitos.find(x=>x.id===rid);
  if(r)['numero','instruccion','mercaderia'].forEach(k=>f[k].value=r[k]??'');
  $('#rTit').textContent=(r?'Remito N° '+r.numero:'Nuevo remito')+' · '+byId(pid).patente;
  pintarArchivosDialogo();$('#dlgR').showModal();
};
function pintarArchivosDialogo(){
  $('#rExistentes').innerHTML=remId?archivosDe(remId).map(a=>miniatura(a,true)).join(''):'';
  $('#rNuevos').innerHTML=nuevos.map((f,i)=>`<div><span>🆕 ${esc(f.name)} (${kb(f.size)})</span><button type="button" class="sec mini" onclick="quitarNuevo(${i})">✕</button></div>`).join('');
  const sinBase=!hayTablaArchivos;$('#btnFoto').disabled=sinBase;$('#btnArchivo').disabled=sinBase;
}
window.quitarNuevo=i=>{nuevos.splice(i,1);pintarArchivosDialogo()};
$('#btnFoto').onclick=()=>$('#inFoto').click();
$('#btnArchivo').onclick=()=>$('#inArchivo').click();
for(const s of ['#inFoto','#inArchivo'])$(s).onchange=e=>{nuevos.push(...e.target.files);e.target.value='';pintarArchivosDialogo()};
window.quitarArchivo=id=>{const a=archivos.find(x=>x.id===id);if(!confirm(`¿Quitar ${a.nombre}?`))return;
  ocupado('Quitando…');
  (async()=>{try{await borrarArchivosStorage([a.ruta]);await api('archivos?id=eq.'+id,{method:'DELETE'});archivos=archivos.filter(x=>x.id!==id)}
    catch(e){alert('No se pudo quitar: '+e.message)}ocupado(false);pintarArchivosDialogo();render()})();
};
window.borrarRemito=rid=>{const d=datos.find(p=>p.remitos.some(r=>r.id===rid)),r=d.remitos.find(x=>x.id===rid);
  if(!confirm(`¿Quitar el remito N° ${r.numero} y sus archivos?`))return;
  hacer('Quitando…',async()=>{await borrarArchivosStorage(archivosDe(rid).map(a=>a.ruta));await api('remitos?id=eq.'+rid,{method:'DELETE'})})};

// Achica las fotos (máx. 2000 px, JPG) para que suban rápido con datos móviles.
async function prepararArchivo(file){
  if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)||file.size<400*1024)return {blob:file,nombre:file.name};
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const k=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',0.82));
    if(blob&&blob.size<file.size)return {blob,nombre:file.name.replace(/\.[^.]+$/,'')+'.jpg'};
  }catch(e){console.log('no se pudo achicar',e)}
  return {blob:file,nombre:file.name};
}
const extension=n=>{const m=/\.([a-z0-9]{1,8})$/i.exec(n);return m?m[1].toLowerCase():'bin'};
$('#frmR').onsubmit=e=>{e.preventDefault();const f=$('#frmR');
  const v={numero:f.numero.value.trim(),instruccion:f.instruccion.value.trim(),mercaderia:f.mercaderia.value.trim()};
  const pid=remPat,lista=[...nuevos];let rid=remId;
  const repetido=byId(pid).remitos.find(r=>r.id!==rid&&r.numero.toLowerCase()===v.numero.toLowerCase());
  if(repetido&&!confirm(`Ya hay un remito N° ${v.numero} en esta patente. ¿Guardarlo igual?`))return;
  $('#dlgR').close();
  hacer('Guardando remito…',async()=>{
    if(rid)await api('remitos?id=eq.'+rid,{method:'PATCH',body:v});
    else rid=(await api('remitos',{method:'POST',body:{patente_id:pid,...v},prefer:'return=representation'}))[0].id;
    for(let i=0;i<lista.length;i++){
      ocupado(`Subiendo archivo ${i+1} de ${lista.length}…`);
      const {blob,nombre}=await prepararArchivo(lista[i]);
      const ruta=`${pid}/${rid}/${uid()}.${extension(nombre)}`;
      await subirArchivo(ruta,blob);
      await api('archivos',{method:'POST',body:{remito_id:rid,patente_id:pid,nombre,tipo:blob.type||null,tamano:blob.size,ruta}});
    }
  })};

// ---------- Descargar una patente (ZIP con resumen + todos los archivos) ----------
const limpio=s=>String(s).replace(/[\\/:*?"<>|\u0000-\u001f]+/g,'-').trim()||'archivo';
window.descargarPatente=id=>{const d=byId(id);
  if(!window.JSZip)return alert('Todavía se está cargando, probá de nuevo en un segundo.');
  hacer('Preparando la descarga…',async()=>{
    const zip=new JSZip(),carpeta=zip.folder(limpio(d.patente)),usados=new Set(),fallas=[];
    const nombreUnico=n=>{let x=n,i=2;while(usados.has(x.toLowerCase()))x=n.replace(/(\.[^.]+)?$/,` (${i++})$1`);usados.add(x.toLowerCase());return x};
    const lineasTxt=[`Patente: ${d.patente} (${d.tipo})`,`Remitos: ${hechos(d)} de ${d.esperados}${faltan(d)?` (faltan ${faltan(d)})`:' (completa)'}`];
    if(d.nota)lineasTxt.push(`Nota: ${d.nota}`);
    lineasTxt.push(`Cargada: ${fecha(d.creado)}`,`Descargado: ${fecha(Date.now())}`,'');
    const csv=[['Numero','Fecha','Instruccion','Mercaderia','Archivos']];
    const todos=d.remitos.flatMap(r=>archivosDe(r.id).map(a=>({r,a})));let n=0;
    const nombres={};
    for(const {r,a} of todos){
      ocupado(`Descargando archivo ${++n} de ${todos.length}…`);
      const nombre=nombreUnico(limpio(`${r.numero} - ${a.nombre}`));
      try{const res=await fetch(urlArchivo(a.ruta));if(!res.ok)throw new Error(res.status);
        carpeta.file(nombre,await res.blob());(nombres[r.id]=nombres[r.id]||[]).push(nombre)}
      catch(e){fallas.push(a.nombre)}
    }
    for(const r of d.remitos){
      lineasTxt.push(`Remito N° ${r.numero} — ${fecha(r.creado)}`);
      if(r.instruccion)lineasTxt.push(`  Instrucción: ${r.instruccion}`);
      if(r.mercaderia)lineasTxt.push(`  Mercadería: ${r.mercaderia}`);
      lineasTxt.push(`  Archivos: ${(nombres[r.id]||[]).join(', ')||'ninguno'}`,'');
      csv.push([r.numero,fecha(r.creado),r.instruccion||'',r.mercaderia||'',(nombres[r.id]||[]).join(', ')]);
    }
    if(fallas.length)lineasTxt.push('No se pudieron bajar: '+fallas.join(', '));
    carpeta.file('resumen.txt',lineasTxt.join('\r\n'));
    carpeta.file('resumen.csv','﻿'+csv.map(f=>f.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n'));
    ocupado('Armando el archivo ZIP…');
    const blob=await zip.generateAsync({type:'blob'});
    const hoy=new Date().toISOString().slice(0,10);
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${limpio(d.patente)}_${hoy}.zip`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);
    if(fallas.length)alert(`Ojo: ${fallas.length} archivo(s) no se pudieron bajar. Están anotados en resumen.txt.`);
  });
};

document.querySelectorAll('[data-cerrar]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('#btnRecargar').onclick=recargar;

// ---------- Notificaciones ----------
function b64ToBytes(b){const p='='.repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))}
async function suscribirPush(){
  // Registra este dispositivo para recibir los avisos con la app cerrada (los manda GitHub cada hora).
  if(!reg||!('PushManager' in window)||Notification.permission!=='granted')return;
  try{let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(C.VAPID_PUBLIC_KEY)});
    const j=sub.toJSON();
    await api('rpc/guardar_suscripcion',{method:'POST',body:{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_dispositivo:navigator.userAgent.slice(0,200)}});
    estadoPush='Este dispositivo está registrado para recibir avisos ✔';
  }catch(e){estadoPush='No se pudo registrar este dispositivo para avisos: '+e.message;console.log('push',e)}
  render();
}
async function notificar(titulo,cuerpo){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const opt={body:cuerpo,icon:'icon.svg',tag:'remitos',renotify:true,vibrate:[200,100,200]};
  try{reg?await reg.showNotification(titulo,opt):new Notification(titulo,opt)}catch(e){console.log(e)}
}
$('#btnNotif').onclick=async()=>{await Notification.requestPermission();await suscribirPush();render()};
$('#btnProbar').onclick=async()=>{if(Notification.permission!=='granted'){await Notification.requestPermission();await suscribirPush()}render();
  const p=datos.filter(d=>faltan(d)>0);notificar('Prueba de aviso',p.length?`Tenés ${p.length} patente(s) pendientes`:'Todo al día')};

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')recargar()});
setInterval(()=>{if(document.visibilityState==='visible'&&$('#ocupado').hidden&&!document.querySelector('dialog[open]'))recargar()},120000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{reg=r;suscribirPush()}).catch(()=>{});
recargar();
</script>
